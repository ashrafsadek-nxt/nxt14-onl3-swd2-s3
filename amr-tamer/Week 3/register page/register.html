<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=fiv, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2>Sign up</h2>
        <form action="" method="get" class="sign-form">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
            <input type="email" placeholder="Email" required>
            <input type="date" placeholder="Birth date" required>
            <input type="tel" placeholder="Phone number" required>
            <input type="password" name="" id="password" placeholder="Password" required>
            <input type="password" name="" id="cpassword" placeholder="Confirm password" required>
            <button type="submit" class="signup">Sign up</button>
            <div class="login-link">Already have an account? <a href="#">Login In</a></div>
            <div class="container-2">or</div>
            <button class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                Sign up with Google
            </button>
        </form>
    </div>
</body>
</html>
