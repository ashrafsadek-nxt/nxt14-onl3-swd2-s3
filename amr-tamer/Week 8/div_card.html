<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
      <div class="container mt-5">
    <div class="row g-4">
      
      <!-- Card 1 -->
      <div class="col-md-4">
        <div class="card shadow-lg h-100">
          <img src="download.jpeg" class="card-img-top" alt="Image 1">
          <div class="card-body">
            <h5 class="card-title">Card One</h5>
            <p class="card-text">This is the first card with some example text.</p>
            <a href="#" class="btn btn-primary">Read more</a>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4">
        <div class="card shadow-lg h-100">
          <img src="download (1).jpeg" class="card-img-top" alt="Image 2">
          <div class="card-body">
            <h5 class="card-title">Card Two</h5>
            <p class="card-text">Here another card with more content inside.</p>
            <a href="#" class="btn btn-success">Explore</a>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4">
        <div class="card shadow-lg h-100">
          <img src="download (2).jpeg" class="card-img-top" alt="Image 3">
          <div class="card-body">
            <h5 class="card-title">Card Three</h5>
            <p class="card-text">This is the third card to complete the row.</p>
            <a href="#" class="btn btn-danger">Contact</a>
          </div>
        </div>
      </div>

    </div>
  </div>
    <!-- bootstrap 5.3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

</html>
