<!DOCTYPE html>
<html>
    <head>
        <title>Calcalator</title>
    </head>
    <body>
        <div>
        <label for="num1" > Enter First Number: </label>
        <input type="number" id="num1" placeholder="First Number" class="numbers"></div>
         <div>
            <label for="num2" > Enter Second Number: </label>
        <input type="number" id="num2" placeholder="Second Number" class="numbers">
    </div>
         <div>
            <label for="num3" > Enter Third Number: </label>
        <input type="number" id="num3" placeholder="Third Number" class="numbers">
    </div>
    <label for="operation"> Choose an operation</label>
    <select id="operation">
<optgroup label="operation">
  <option value="+">1-Addation</option>
  <option value="-">2-Subtraction</option>
  <option value="*">3-Multiplication</option>
  <option value="/">4-Division</option>
</optgroup>
   </select>
   <input type="number" id="opnum"  placeholder="number of operation" >
   <input type="button" value="count" id="count" >
   <input type="number" id="result" placeholder="result" >
   <script src="/assets/js/calcalator.js" ></script>
 </body>
</html>
