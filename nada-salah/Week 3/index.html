<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }

        .signup-container {
            width: 300px;
            padding: 20px;
            border: 1px solid  #007bff;;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-family: sans-serif;
            background-color: white;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .signup-button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .login-link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: #777;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
        }

        .divider {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            color: #777;
        }

        .divider hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 10px 0;
        }

        .google-signup-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none; /* For the <a> tag version if used */
        }

        .google-signup-button img {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Sign Up</h2>
        <form>
            <div class="form-group">
                <input type="text" placeholder="First name">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Last name">
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email">
            </div>
            <div class="form-group">
                <input type="date" placeholder="Birth date">
            </div>
            <div class="form-group">
                <input type="tel" placeholder="Phone number">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Confirm password">
            </div>
            <button type="submit" class="signup-button">Sign Up</button>
            <div class="login-link">
                Already have an account? <a href="#">Log in</a>
            </div>
            <div class="divider">
                <hr>
                or
            </div>
            <button class="google-signup-button">
                <img src="C:\Nada Salah Abdelkarim NXT14-DEPI\Week 3\16px-Google__G__logo.svg.png" alt="Google Logo">
                Sign up with Google
            </button>
        </form>
    </div>

</body>
</html>
