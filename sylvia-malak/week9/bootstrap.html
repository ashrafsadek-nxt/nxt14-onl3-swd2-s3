<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Assignment</title>
  <link rel="stylesheet" href="assets/bootstrap-5.3.7-dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">MySite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
          <li class="nav-item"><a href="#" class="nav-link">About</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="bg-light text-center p-5">
    <h1 class="display-4">Welcome to MySite</h1>
    <br>
    <button class="btn btn-primary btn-lg">Get Started</button>
  </header>

  <!-- Grid Layout Section -->
  <section class="container my-5">
    <h2 class="text-center mb-4">Our Services</h2>
    <div class="row text-center">
      <div class="col-sm-12 col-md-6 col-lg-4 mb-3">
        <div class="p-4 bg-info text-light rounded">Service 1</div>
      </div>
      <div class="col-sm-12 col-md-6 col-lg-4 mb-3">
        <div class="p-4 bg-primary text-light rounded">Service 2</div>
      </div>
      <div class="col-sm-12 col-md-6 col-lg-4 mb-3">
        <div class="p-4 bg-secondary text-light rounded">Service 3</div>
      </div>
    </div>
  </section>

  <!-- Form Section -->
  <section class="container my-5">
    <h2 class="text-center mb-4">Contact Us</h2>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your name">
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" rows="4" placeholder="Your message"></textarea>
      </div>
      <div class="col-12 text-center">
        <button class="btn btn-primary">Send</button>
      </div>
    </form>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-center text-light p-3">
    <p class="mb-0">&copy; 2025 MySite. All Rights Reserved.</p>
  </footer>

  <script src="assets/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
