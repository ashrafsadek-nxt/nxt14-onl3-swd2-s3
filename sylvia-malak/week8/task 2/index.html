<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Cards</title>
  <link rel="stylesheet" href="../assets/bootstrap-5.3.7-dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <div class="row m-3">

      
      <div class="col-lg-3 col-md-6 col-sm-12 mb-4">
        <div class="card h-100 text-center shadow">
          <img src="../assets/images/card1.jpg" class="card-img-top" alt="Card 1">
          <div class="card-body">
            <h5 class="card-title">Ween Cats v.1</h5>
            <button class="btn btn-success">Buy</button>
          </div>
        </div>
      </div>

      
      <div class="col-lg-3 col-md-6 col-sm-12 mb-4">
        <div class="card h-100 text-center shadow">
          <img src="../assets/images/card2.jpg" class="card-img-top" alt="Card 2">
          <div class="card-body">
            <h5 class="card-title">Ween Cats v.2</h5>
            <button class="btn btn-success">Buy</button>
          </div>
        </div>
      </div>

      
      <div class="col-lg-3 col-md-6 col-sm-12 mb-4">
        <div class="card h-100 text-center shadow">
          <img src="../assets/images/card3.jpg" class="card-img-top" alt="Card 3">
          <div class="card-body">
            <h5 class="card-title">Ween Cats v.3</h5>
            <button class="btn btn-success">Buy</button>
          </div>
        </div>
      </div>

      
      <div class="col-lg-3 col-md-6 col-sm-12 mb-4">
        <div class="card h-100 text-center shadow">
          <img src="../assets/images/card4.jpg" class="card-img-top" alt="Card 4">
          <div class="card-body">
            <h5 class="card-title">Ween Cats v.4</h5>
            <button class="btn btn-success">Buy</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../assets/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
