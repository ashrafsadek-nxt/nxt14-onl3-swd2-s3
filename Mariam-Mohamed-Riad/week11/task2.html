<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page</title>
  <link rel="stylesheet" href="task2.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="logo">Welcome Back</h1>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
          <div class="error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" minlength="6" placeholder="Enter your password" required />
          </div>
          <div class="error" id="password-error"></div>
        </div>

        <div class="actions">
          <label class="remember">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <button id="submit" type="submit" class="btn">Login</button>
        </div>

        <p class="helper">Don’t have an account? <a href="#">Sign up</a></p>
      </form>
    </section>
  </main>
     
  <script src="../dist/task2.js" defer></script>
</body>
</html>
