<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=7">
     <meta http-equiv="X-UA-Compatible" content="ie=edge">
     <meta name="description" content="">
     <meta name="keywords" content="">
     <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <title>Log in</title>
    <!-- local bootstrap 5.3 -->
    <link rel="stylesheet" href="assets/bootstrap-5.3.7-dist/css/bootstrap.min.css">
   <style>
    #login{
        background-color: #355E3B;
        margin-top: 150px;
        padding: 40px 30px 100px 30px;
    }
    .form-label{
        font-size: 20px;
    }
    #Login-submit-button{
        background-color: #FFFDD0;
        font-size: 20px;
    }
    #Login-submit-button:hover{
        color: black;
    }
   </style>
</head>
<body>
    <div class="container w-50  text-light" id="login">
        <div class="container ligin-title text-center">
            <h2>Welcome Back !</h2>
            <p>Log in to enjoy our services.</p>
         </div>
        <form  id="LogInForm">
            <div class="inputs mt-5">
                <label class="form-label"  for="username">Username:</label>
                <input type="text" class="form-control bg-light" id="username" name="Username" required>
            </div>
            <div class="inputs mt-4">
                <label class="form-label" for="password">Password:</label>
                <input type="password" class="form-control bg-light" id="password" name="password" required>
            </div>
            <div class="inputs mt-5">
                <input type="submit" class="btn w-100" id="Login-submit-button" value="Submit">
            </div>
        </form>
    </div>

<script src="assets/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/task2.js"></script>
</body>
</html>
