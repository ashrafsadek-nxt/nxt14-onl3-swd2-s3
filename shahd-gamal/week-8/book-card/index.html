<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arabic Book Card - Simple</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card book-card">
        <img
          src="255700 (1).jpg"
          class="card-img-top"
          alt="غلاف الكتاب"
          style="height: 250px; object-fit: cover" />

        <div class="card-body">
          <h5 class="card-title">الداء والدواء</h5>
          <p class="card-text text-muted">الامام ابم القيم</p>
          <p class="card-text">
            <span class="text-decoration-line-through text-muted me-2"
              >120 ج.م</span
            >
            <span class="fw-bold text-success fs-5">90 ج.م</span>
          </p>
          <button class="btn btn-primary w-100">أضف إلى السلة</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
