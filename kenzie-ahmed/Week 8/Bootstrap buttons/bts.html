<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Demo</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>

  <body class="p-4">
    <div class="container bg-danger text-white p-3 mb-3">hello</div>

    <div class="container-fluid bg-info p-3 mb-3">welcome</div>

    <div class="mb-3">
      <button class="btn bg-danger me-2">click</button>
      <button class="btn bg-primary me-2 ms-2">click</button>

      <button class="btn bg-dark text-white me-2 ms-3">click</button>

      <button class="btn bg-light text-dark me-2 ms-4">click</button>

      <button class="btn bg-info me-2">click</button>
      <button class="btn bg-secondary me-2">click</button>
      <button class="btn bg-warning me-2">click</button>
      <button class="btn bg-success">click</button>
    </div>

    <span class="me-4">ahmed</span>
    <span class="ms-5">aly</span>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
