<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple E-commerce Cards</title>

  <!-- Bootstrap 5.3 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container py-4">
    <h2 class="mb-4">Shop</h2>

    <!-- Responsive grid -->
    <div class="row g-3 row-cols-1 row-cols-sm-2 row-cols-md-3">

      <!-- Card 1 -->
      <div class="col">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
          <div class="card-body">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="fw-bold">$59.99</p>
            <p class="card-text">Comfortable, long battery life, fast charge.</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
          <div class="card-body">
            <h5 class="card-title">Smart Watch</h5>
            <p class="fw-bold">$129.00</p>
            <p class="card-text">Heart rate, GPS, sleep tracking.</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
          <div class="card-body">
            <h5 class="card-title">Gaming Mouse</h5>
            <p class="fw-bold">$24.50</p>
            <p class="card-text">Ergonomic design with DPI switch.</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
