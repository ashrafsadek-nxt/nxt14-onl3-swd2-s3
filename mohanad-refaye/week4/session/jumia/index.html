<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumia Header Clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-banner">
      <div class="sell">
        <a href="#" class="sell-link">Sell on Jumia</a>
      </div>
      <div class="pay">
        <span class="pay-text">Pay on Delivery</span>
        <a href="#" class="pay-link">Learn More</a>
      </div>
      <div class="lang">
        <a href="">english</a>
        <span class="lang-separator">|</span>
        <a href="">عربي</a>
      </div>
    </div>
    <header class="header">
      <div class="header-container">
        <a href="#" class="logo">
          <div class="logo-icon">J</div>
          JUMIA
        </a>

        <div class="search-section">
          <div class="search-container">
            <input
              type="text"
              class="search-input"
              placeholder="Search products, brands and categories"
            />
            <button class="search-btn">SEARCH</button>
          </div>
        </div>

        <div class="header-actions">
          <a href="#" class="action-item">
            <div class="action-icon icon-user"></div>
            <span>Account</span>
          </a>
          <a href="#" class="action-item">
            <div class="action-icon icon-help"></div>
            <span>Help</span>
          </a>
          <a href="#" class="action-item">
            <div class="cart-container">
              <div class="action-icon icon-cart"></div>
              <div class="cart-badge">2</div>
            </div>
            <span>Cart</span>
          </a>
        </div>
      </div>
    </header>

    <nav class="navigation">
      <div class="nav-container">
        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#" class="nav-link active">🏠 Home</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">📱 Phones & Tablets</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">💻 Computing</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">📺 Electronics</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">👗 Fashion</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">🏠 Home & Garden</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">⚽ Sporting Goods</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">🎮 Gaming</a>
          </li>
        </ul>
      </div>
    </nav>
    <main class="main-content">
      <div class="content-container" style="height: 120vh">
        <h1>Welcome to Jumia!</h1>
        <p>Explore our wide range of products and enjoy great deals.</p>
      </div>
    </main>
  </body>
</html>
