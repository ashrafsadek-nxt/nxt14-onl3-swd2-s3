  <style>
    div{
      border: 1px solid black;
      padding:15px;
      margin:10px;
      text-align: center;
      background-color: antiquewhite;
    }
        @media only screen and (max-width:1200px)
      {
        div{
           background-color: rgb(169, 178, 52);
        display:inline-flex;
        margin: 20px;
        text-align: center;
        
      }
      }
      @media only screen and (max-width:992px)
      {
         div{
          background-color:crimson;
         display:inline-flex;
        margin: 20px;
        text-align: center;
      }
      }
      @media only screen and (max-width:576px)
      {
         div{
          background-color:rgb(78, 185, 204);
         display:block;
        margin: 20px;
        text-align: center;
      }
      }
    </style>
