<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-UA-compatible"content="IE=7">
  <meta http-equiv="x-UA-compatible"content="ie=edge">
  <meta name="description" content="my first week task">
  <meta name="Keywords" content="Html,css,meta,learning,software,frontend">
  <title>form</title>
</head>
<link rel="stylesheet" href="formstyle.css">
<body>

<p id="text"></p>
   

<form action="" method="post">
  <div>
    <label for="username">Username</label>
    <input type="text" name="username" id="username" required>
  </div>

  <div>
    <label for="pwd">Password</label>
    <input type="password" name="password" id="pwd" required>
  </div>

  <div>
    <label for="c">Color</label>
    <input type="color" id="c">
  </div>

  <div>
    <label for="num">Number</label>
    <input type="number" id="num" placeholder="Age">
  </div>

  <div>
    <label for="time">Time</label>
    <input type="time" id="time">
  </div>

  <div>
    <label for="date">Date</label>
    <input type="date" id="date">
  </div>

  <div>
    <label for="s">Search</label>
    <input type="search" id="s">
  </div>

  <div>
    <label for="file">File</label>
    <input type="file" id="file">
  </div>

  <div>
    <label for="tel">Telephone</label>
    <input type="tel" id="tel">
  </div>

  <div>
    <span>Gender</span>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="female" checked> Female</label>
  </div>

  <div>
    <span>Hobbies</span>
    <label><input type="checkbox" name="ho" id="draw"> Draw</label>
    <label><input type="checkbox" name="ho" id="read"> Read</label>
    <label><input type="checkbox" name="ho" id="swim"> Swim</label>
  </div>

  <div>
    <label for="url">URL</label>
    <input type="url" id="url">
  </div>

  <div>
    <label for="email">Email</label>
    <input type="email" id="email">
  </div>

  <div>
    <label for="mon">Month</label>
    <input type="month" id="mon">
  </div>

  <div>
    <label for="we">Week</label>
    <input type="week" id="we">
  </div>

  <div>
    <label for="country">Country</label>
    <input type="text" list="city" placeholder="Country">
    <datalist id="city">
      <option value="Cairo"></option>
      <option value="Luxor"></option>
      <option value="Alex"></option>
    </datalist>
  </div>

  <div>
    <label>Choose Cities (Multiple)</label>
    <select multiple>
      <option value="1" selected>Valley</option>
      <option value="2">Tanta</option>
      <option value="3">Giza</option>
    </select>
  </div>

  <div>
    <label for="range">Range</label>
    <input type="range" id="range" min="0" max="100">
  </div>

  <div>
    <label for="textarea">Message</label>
    <textarea id="textarea" cols="30" rows="5" placeholder="Write something..."></textarea>
  </div>

  <div>
    <input type="submit" value="Save">
    <input type="reset" value="Delete">
  </div>
</form>
  
  <script src="formjs.js"></script>
</body>
</html>
