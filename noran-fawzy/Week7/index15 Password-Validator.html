<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator</title>
    <link rel="stylesheet" href="css/style15.css">
</head>
<body>
    <div class="card">
        <div>
            <label for="pwd">password</label>
            <input id="pwd" type="password" autocomplete="new-password" />
            <span id="status" class="bad">Weak Password, missing:</span>
        </div>
    
        <ul id="missing">
        </ul>
    
        <button id="validate" disabled>validate</button>
        <div class="hint"></div>
    </div>
    <script src="js/script15.js"></script>
</body>
</html>
