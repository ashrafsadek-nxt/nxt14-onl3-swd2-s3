<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="CSS/style20.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="images/logo.png" alt="Logo"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Documents</a></li>
      </ul>
      <form class="d-flex me-3">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-success" type="submit"> <i class="fa-solid fa-magnifying-glass"></i> </button>
      </form>
      <button class="btn btn-secondary" id="toggleMode"><i class="fa-solid fa-toggle-on"></i></button>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container mt-5 pt-4">
  <div class="row">
    <!-- Sidebar Search -->
    <div class="col-md-3 sidebar">
      <h5>Search Filters</h5>
      <div class="mb-3">
        <label>Price</label>
        <input type="range" class="form-range">
      </div>
      <div class="mb-3">
        <label>Quantity</label>
        <input type="number" class="form-control">
      </div>
      <div class="mb-3">
        <label>Type</label>
        <select class="form-select">
          <option>All</option>
          <option>Type 1</option>
          <option>Type 2</option>
        </select>
      </div>
    </div>

    <!-- Products -->
    <div class="col-md-6">
      <div class="row">
        <!-- 8 Products -->
        <div class="col-md-6 mb-4" >
          <div class="card">
            <img src="images/image1.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 1</h5>
              <p class="card-text">$50</p>
              <a href="product.html?product=1" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image2.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 2</h5>
              <p class="card-text">$60</p>
              <a href="product.html?product=2" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image3.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 3</h5>
              <p class="card-text">$70</p>
              <a href="product.html?product=3" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image4.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 4</h5>
              <p class="card-text">$80</p>
              <a href="product.html?product=4" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image5.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 5</h5>
              <p class="card-text">$55</p>
              <a href="product.html?product=5" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image6.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 6</h5>
              <p class="card-text">$65</p>
              <a href="product.html?product=6" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image7.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 7</h5>
              <p class="card-text">$75</p>
              <a href="product.html?product=7" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card">
            <img src="images/image8.png" alt="Product">
            <div class="card-body">
              <h5 class="card-title">Product 8</h5>
              <p class="card-text">$85</p>
              <a href="product.html?product=8" class="btn btn-primary">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ads Sidebar -->
    <div class="col-md-3 ads">
      <h5>Advertisements</h5>
      <img src="https://picsum.photos/200/150?random=101" class="img-fluid mb-2">
      <img src="https://picsum.photos/200/150?random=102" class="img-fluid">
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="bg-light text-dark mt-4 p-3 d-flex justify-content-end fixed-bottom">
  <a href="#" class="me-3"><i class="fa-brands fa-facebook"></i></a>
  <a href="#" class="me-3"><i class="fa-brands fa-google"></i></a>
  <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
</footer>

<script src="JS/script20.js"></script> 
<script src="JS/bootstrap.bundle.js"></script>
<script src="JS/all.min.js"></script>   
</body>
</html>
