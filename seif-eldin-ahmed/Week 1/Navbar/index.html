<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width / 2, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            text-decoration: none;
            font-family: calibri;
        }
        body {
            background-color: rgb(37, 37, 37);
        }
        .navbar {
            background-color: rgb(59, 59, 59);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
        }
        li {
            display: inline-block;
            color: white;
        }
        a {
            color: white
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgb(59, 59, 59);
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .dropdown-content li {
            display: block;
            padding: 5px 10px;
        }

        .dropdown-content li a {
            color: white;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
         <div class="logo-container">
            <a href="/index.html">
                <img src="https://castiel.vercel.app/static/media/logo.a976cbf64b0f6a663aff.png" alt="logo" style="width: 50px;"/>
            </a>
         </div>
        <ul style="list-style: none;">
            <li><a href="/about-us.html">About Us</a></li>
            <li><a href="/contact-us.html">Contact Us</a></li>
            <li class="dropdown">
                <a href="#">Socials</a>
                <ul class="dropdown-content">
                    <li><a href="https://facebook.com">Facebook</a></li>
                    <li><a href="https://instagram.com">Instagram</a></li>
                    <li><a href="https://linkedin.com">Linked In</a></li>
                </ul>
            </li>
            <li><input type="text"/> Search</li>
        </ul>
        </div>
    </nav>
</body>
</html>
