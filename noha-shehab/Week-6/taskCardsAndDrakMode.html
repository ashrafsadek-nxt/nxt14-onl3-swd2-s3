<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task</title>
  </head>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .card {
      width: 100px;
      height: 100px;
      background-color: #ccc;
      margin: 10px;
      display: inline-block;
      line-height: 100px;
      font-size: 20px;
    }
    #showCards {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
    }

    .dark .card {
      background-color: #000000;
      color: white;
    }
  </style>
  <body>
    <button id="showCards">Show</button>
    <button id="darkModeToggle">Toggle Dark Mode</button>

    <div id="cardsContainer" style="display: none">
      <div class="card">HI</div>
      <div class="card">I'M</div>
      <div class="card">NOHA</div>
      <div class="card">SHEHAB</div>
    </div>
    <script src="taskCardsAndDarkMode.js"></script>
  </body>
</html>
