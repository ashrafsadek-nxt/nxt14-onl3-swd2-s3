<!DOCTYPE html>
<html>
    <head>
        <title> REGISTER </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=7">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="description" content="DEPI React course for students, ">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1> FACEBOOK </h1>
        <div class="registration-form">
            <h2> SIGN UP </h2>
            <form action="index.html" method="get">
                <label for="fname">First name</label>
                <input id="fname" type="text" name="fname" placeholder="first name">

                <label for="lname">Last name</label>
                <input id="lname" type="text" name="lname" placeholder="last name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email">

                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="age">

                <label for="tel">Phone number</label>
                <input type="tel" id="tel" name="phone" placeholder="phone number">

                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="password">

                <label for="pass">Password</label>
                <input type="password" name="pass" placeholder="confirm password">

                <label>Gender:</label>
                <input type="radio" name="gender" value="female"> Female
                <input type="radio" name="gender" value="male"> Male 

                <button type="submit" class="btn"> sign-up </button>
                <br>

                <p1>Already have an account?</p1>
                <p2>Log in </p2>








            </form>
        </div>
    </body>
</html>
