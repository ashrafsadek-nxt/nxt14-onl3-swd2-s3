<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-list</title>
    <link rel="stylesheet" href="website.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="logo" text="To-Do-List">To-Do-List</h1>
        <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="toggleframe">
            <button class="toggle">
            </button>
        </div>
    </nav>
    <div class="container">
        <div class="tasks">
            <div class ="box">
                <h2>Today</h2>
                <div class="circle circle-1">
                    <div class="percent ptext-1">0%</div>
                </div>
                <ul>
                    <li> 
                       <div class="checkbox-wrapper-11">
                            <input id="task-1-1" type="checkbox" class="task" name="r" value="2" group="1">
                            <label for="task-1-1">Check email</label>
                        </div></li>
                    <li>      
                        <div class="checkbox-wrapper-11">
                            <input id="task-1-2" type="checkbox" class="task" name="r" value="2" group="1">
                            <label for="task-1-2">Finish homework</label>
                        </div></li>
                    <li>
                        <div class="checkbox-wrapper-11">
                            <input id="task-1-3" type="checkbox" class="task" name="r" value="2" group="1">
                            <label for="task-1-3">Call mom</label>
                        </div>
                    </li>
                </ul>
            </div>
            <div class ="box">
                <h2>Tomorrow</h2>
                <div class="circle circle-2">
                    <div class="percent ptext-2">0%</div>
                </div>
                <ul>
                    <li> 
                        <div class="checkbox-wrapper-11">
                            <input id="task-2-1" type="checkbox" class="task" name="r" value="2" group="2">
                            <label for="task-2-1">Buy groceries</label>
                        </div>
                    </li>
                    <li>      
                        <div class="checkbox-wrapper-11">
                            <input id="task-2-2" type="checkbox" class="task" name="r" value="2" group="2">
                            <label for="task-2-2">Go for a run</label>
                        </div>
                    </li>
                    <li>
                        <div class="checkbox-wrapper-11">
                            <input id="task-2-3" type="checkbox" class="task" name="r" value="2" group="2">
                            <label for="task-2-3">Water plants</label>
                        </div>
                    </li>
                </ul>
            </div>
            <div class ="box">
                <h2>Later</h2>
                <div class="circle circle-3">
                    <div class="percent ptext-3">0%</div>
                </div>
                <ul>
                    <li> 
                       <div class="checkbox-wrapper-11">
                            <input id="task-3-1" type="checkbox" class="task" name="r" value="2" group="3">
                            <label for="task-3-1">Plan vacation</label>
                        </div></li>
                    <li>      
                        <div class="checkbox-wrapper-11">
                            <input id="task-3-2" type="checkbox" class="task" name="r" value="2" group="3">
                            <label for="task-3-2">Read a book</label>
                        </div></li>
                    <li>
                        <div class="checkbox-wrapper-11">
                            <input id="task-3-3" type="checkbox" class="task" name="r" value="2" group="3">
                            <label for="task-3-3">Organize closet</label>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="input">
            <p>Enter your task here</p>
            <div class="frame">
            <div class="arrow"></div>
            </div>
            <input type="text" placeholder="Enter your Task name" id="taskname" hidden>
            <button class="add" aria-label="Add task">+</button>
        </div>
    </div>

<script src="website.js"></script>    
</body>
</html>
