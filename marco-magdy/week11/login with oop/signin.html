<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <div class="container">
        <div class="container-signin">
        <h1>Sign In</h1>
        <form>
            <label for="signin-username">Username:</label>
            <input type="text" placeholder="Username" id="signin-username">
            <label for="signin-password">Password:</label>
            <input type="password" placeholder="Password" id="signin-password">
            <button type="submit" id="signin-button">Sign In</button>
        </form>
        </div>
        <div class="container-signup">
        <h1>Sign Up</h1>
        <form>
            <label for="signup-username">Username:</label>
            <input type="text" placeholder="Username" id="signup-username">
            <label for="email">Email:</label>
            <input type="email" placeholder="Email" id="email" autocomplete="on">
            <label for="signup-password">Password:</label>
            <input type="password" placeholder="Password" id="signup-password">
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" placeholder="Confirm Password" id="confirm-password">
            <input type="password" placeholder="Confirm Password" id="signup-confirm-password">
            <button type="submit" id="signup-button">Sign Up</button>
        </form>
        </div>
        <div class="container-overlay">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button id="signin">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button id="signup">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    <script src="signin.js"></script>
</body>
</html>
