<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode & Cards Task</title>
  <style>
    body {
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      text-align: center;
      transition: 0.5s;
    }
    .dark-mode {
      background: #121212;
      color: white;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      font-size: 16px;
    }
    .card {
      border: 1px solid #444;
      padding: 20px;
      margin: 10px;
      width: 100px;
      display: inline-block;
      background: #f2f2f2;
      transition: 0.3s;
    }
    .dark-mode .card {
      background: #333;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Dark/Light Mode & Cards Task</h1>
  
  <!-- زرار تغيير الوضع -->
  <button id="modeBtn" onclick="toggleMode()">Dark Mode</button>
  
  <!-- زرار الكروت -->
  <button id="cardsBtn" onclick="generateCards()">Show Cards</button>
  
  <!-- مكان الكروت -->
  <div id="cardsContainer"></div>
  
  <script>
    // ========== Dark/Light Mode ==========
    function toggleMode() {
      let body = document.body;
      let btn = document.getElementById("modeBtn");

      body.classList.toggle("dark-mode");

      if (body.classList.contains("dark-mode")) {
        btn.innerText = "Light Mode";
      } else {
        btn.innerText = "Dark Mode";
      }
    }

    // ========== Cards Once ==========
    let cardsGenerated = false;

    function generateCards() {
      if (!cardsGenerated) {
        let container = document.getElementById("cardsContainer");

        for (let i = 1; i <= 4; i++) {
          let card = document.createElement("div");
          card.innerText = "Card " + i;
          card.className = "card";
          container.appendChild(card);
        }

        cardsGenerated = true;
      }
    }
  </script>
</body>
</html>
