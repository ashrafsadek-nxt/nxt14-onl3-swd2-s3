<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Div" style="font-size: 30px; text-align: center;">
        <h1>Password Test</h1>
        <input id="Text" type="text">
        <button id="btn">Submit</button>
        <p id="result" style="color: rgb(124, 41, 41); font-size: 20px;"></p>
    </div>
</body>
<script>

    document.getElementById("btn").addEventListener("click", function(){
        let Valuee = document.getElementById("Text").value 
            const password = Valuee ;
            const minLength = 8;
            
            const hasUpperCase = /[A-Z]/;
            const hasLowerCase = /[a-z]/;
            const hasNumber = /[0-9]/;
            const hasSpecialChar = /[!@#$%^&*]/;
            
                if (password.length < minLength) {
                    document.getElementById("result").innerHTML=('Error: Password must be at least 8 characters long.');
                } else if (!hasUpperCase.test(password)) {
                    document.getElementById("result").innerHTML=('Error: Password must contain at least one uppercase letter.');
                } else if (!hasLowerCase.test(password)) {
                    document.getElementById("result").innerHTML=('Error: Password must contain at least one lowercase letter.');
                } else if (!hasNumber.test(password)) {
                    document.getElementById("result").innerHTML=('Error: Password must contain at least one number.');
                } else if (!hasSpecialChar.test(password)) {
                    document.getElementById("result").innerHTML=('Error: Password must contain at least one special character (!@#$%^&*).');
                } else {
                    document.getElementById("result").innerHTML=('Success: Password is valid.');
                }
        })
</script>
</html>
