<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="Assigment-Style.css" />
    <title>Game-Volt</title>
</head>
<body>
    <div class="Navbar">
        <div class="Logo">
            <h2>GAME-VOLT ✨</h2>
        </div>
        <div class="Search">
            <input type="search" placeholder="🔍 Search About Your Favourite Game" />
            <button>Search</button>
        </div>
        <div class="Account">
            <i class="fa fa-user"></i>
            <a href="#">Account</a>
        </div>
        <div class="Help">
            <i class="fa fa-question-circle"></i>
            <a href="#">Help</a>
        </div>
        <div class="Cart">
            <i class="fa fa-shopping-cart"></i>
            <a href="#">Cart</a>
        </div>
    </div>
    <div class="Content">
        <div class="Game-Card">
            <img src="Picture/Cod.jpg" alt="game" />
            <h3>COD Black Ops 6</h3>
            <p>$79.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/GTA 5.jpg" alt="">
            <h3>GTA 5</h3>
            <p>$69.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/FC25.jpg" alt="game" />
            <h3>FIFA 25</h3>
            <p>$39.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/RDR2.jpg" alt="game" />
            <h3>RDR 2</h3>
            <p>$29.99</p>
            <button>Add to Cart</button>
        </div>
            <div class="Game-Card">
            <img src="Picture/RE 8.jpg" alt="game" />
            <h3>RE 8</h3>
            <p>$69.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/OL 2.jpg" alt="game" />
            <h3>Outlast 2</h3>
            <p>$49.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/Detroit.jpg" alt="game" />
            <h3>Detroit</h3>
            <p>$69.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/Spider-Man.jpg" alt="Game">
            <h3>Spider-Man</h3>
            <p>$69.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/PTR.jpg" alt="">
            <h3>PTR 2</h3>
            <p>$69.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="Game-Card">
            <img src="Picture/GTA VI.jpg" alt="">
            <h3>GTA VI</h3>
            <p>$119.99</p>
            <button>Soon</button>
        </div>
    </div>
    <div class="Footer" id="Footer">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
    </div
    </body>
</html>
