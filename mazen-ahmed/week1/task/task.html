<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation with Search</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      display: flex;
      
      align-items: center;
      padding: 10px 20px;
      background-color: #f2f2f2;
    }
    ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    li {
      position: relative;
    }
    li div {
      display: block;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
   
    li div a {
      display: block;
      padding: 5px 10px;
      text-decoration: none;
      color: #333;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    input[type="search"] {
      padding: 5px;
    }
  </style>
</head>
<body>

<nav>
  <ul>
    <li>Home</li>
    <li>About</li>
    <li>Links
      <div>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </li>
  </ul>

  <div class="search-box">
    <input type="search" name="search" placeholder="Search...">
    <button>Search</button>
  </div>
</nav>

</body>
</html>
