<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="tesk of bootstrap button">
    <meta name="keywords" content="button">
    <link rel="stylesheet" href="bootstrap-5.3.7-dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>button task</title>
</head>
<body>
    <div class="container d-flex justify-content-around mt-5">
        <button class="btn btn-primary">
            <span class="spinner-grow spinner-grow-sm"></span>Primary</button>
        <button class="btn btn-secondary active">Secondary</button>
        <button class="btn btn-success disabled">Success</button>
        <button class="btn btn-outline-danger btn-sm">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark ">
            <span class="spinner-border spinner-border-sm"></span>Dark</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="bootstrap-5.3.7-dist/js/bootstrap.min.js"></script>
</body>
</html>
