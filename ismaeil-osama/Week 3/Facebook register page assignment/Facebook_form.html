<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Task</title>
</head>

<body>
    <div style="height: 50px;background-color: rgb(29, 124, 232);">
    </div>
    <div>
        <img src="Facebook_icon.svg.webp" alt="Facebook Logo" style="width: 100px; height: 100px;">
    </div>
    <form action="https://www.facebook.com" method="post">
        <label for="Fname">First Name: <br></label>
        <input type="text" id="Fname" name="Fname"> <br>
        <label for="Lname">Last Name: <br></label>
        <input type="text" id="Lname" name="Lname"><br>
        <label for="email">Email: <br></label>
        <input type="email" id="email" name="Email"><br>
        <label for="DoB">Date Of Birth: <br></label>
        <input type="date" id="DoB" name="Date"><br>
        <label for="Pass">Password: <br></label>
        <input type="password" id="Pass" name="Password"><br>
        <label for="ConfPass"> Confirm Password: <br></label>
        <input type="password" id="ConfPass" name="ConfPass"><br>
        <label for="">Gender: <br></label>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label> <br>
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label><br>
        <input type="submit" value="Create Account">
        <input type="reset" value="Clear Data"><br>
    </form>

</body>

</html>
