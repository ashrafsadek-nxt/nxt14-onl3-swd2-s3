<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <form action="index.html" method="get" target="_blank">
        <div>
            <label for="name">name:</label>
            <input type="text" name="name" id="name">
        </div>
        <div>
            <label for="ema"></label>
            <input type="email" name="ema" id="ema">
        </div>
        <div>
            <input type="number" name="" id="">
        </div>
        <div>
            <input type="range" name="" id="" min="1" max=20>
        </div>
        <div>
            <input type="color" name="" id="">
        </div>
        <div>
            <input type="file" name="" id="">
        </div>
        <div>
            <input type="date" name="" id="">
        </div>
        <div>
            <input type="datetime" name="" id="">
        </div>
        <div>
            <input type="time" name="" id="">
        </div>
        <div>
            <input type="checkbox" name="" id="">
            <input type="checkbox" name="" id="">
            <input type="checkbox" name="" id="">
        </div>
        <div>
            <input type="radio" name="" value="egp">
            <input type="radio" name="" value="ksa">
            <input type="radio" name="" value="usa">
        </div>
        <div>
            <select name="" id="" multiple>
                <option value="cairo">cairo</option>
                <option value="benha">benha</option>
                <option value="giza">giza</option>
            </select>
        </div>
        <div>
            <input type="text" name="" id="" list="name">
            <datalist id="name">
                <option value="Mostafa">
                <option value="Deif">
                <option value="sasa">
            </datalist>
        </div>
        <div>
            <textarea name="" id="" cols="12" rows="10"></textarea>
        </div>
        <div>
            <input type="submit">
            <input type="reset">
        </div>
    </form>
</body>
</html>
