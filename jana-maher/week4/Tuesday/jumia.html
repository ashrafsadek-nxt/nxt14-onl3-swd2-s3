<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Jumia Header</title>
  <link rel="stylesheet" href="/Tuesday/jumia.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Banner -->
<div class="banner">
  <div class="banner-item sale">
    <span class="bold">APPLIANCES</span> <span class="bold">TECH SALE ⚡</span>
  </div>

  <div class="banner-item date">
    21 July - 3 August
  </div>

  <div class="banner-item forsa">
    <span>0% Down Payment</span>
    <span>0% Interest</span>
    <span>0% Admin Fees</span>
    <span>فرصة FORSA</span>
  </div>

  <div class="banner-item live">
    • Live now
  </div>

  <div class="banner-item call">
    <span class="call-text">Call To Order</span>
    <span class="call-number">17269</span>
  </div>
</div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-content">
      <span class="italic">Sell on Jumia</span>
      <div class="lang-switch">English | عربي</div>
    </div>
  </div>
  <!-- Search Header -->
  <header class="main-header">
  <div class="logo">JUMIA</div>

  <div class="search-box">
    <input type="text" placeholder="Search products, brands and categories" />
    <button>Search</button>
  </div>

  <div class="actions">
    <div class="dropdown">
      <a href="#"><i class="fas fa-user"></i> Account</a>
      <div class="dropdown-content">
        <a href="#">Login</a>
        <a href="#">Register</a>
        <a href="#">My Orders</a>
      </div>
    </div>

    <div class="dropdown">
      <a href="#"><i class="fas fa-question-circle"></i> Help</a>
      <div class="dropdown-content">
        <a href="#">Customer Service</a>
        <a href="#">FAQs</a>
        <a href="#">Contact Us</a>
      </div>
    </div>

    <a href="#"><i class="fas fa-shopping-cart"></i> Cart</a>
  </div>
</header>

  <main>
    <h2>Scroll Down</h2>
    <p style="height: 2000px;"></p>
  </main>
</body>
</html>
